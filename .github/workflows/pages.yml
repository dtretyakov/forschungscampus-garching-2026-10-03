name: Deploy to GitHub Pages

on:
  push:
    branches: [main, claude/garching-stations-map-filter-xsx2sw]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html style.css app.js sw.js manifest.webmanifest icon.svg data vendor _site/
          rm -f _site/data/manual_coords.json _site/data/i18n_*.json _site/data/georef.json
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
