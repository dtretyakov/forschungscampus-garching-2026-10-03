name: Fetch sources

# Downloads the official station list, site plan and OSM campus data and
# commits them to sources/ on the branch the workflow ran on.
on:
  workflow_dispatch:
  push:
    paths:
      - scripts/fetch_sources.py
      - .github/workflows/fetch-sources.yml

permissions:
  contents: write

concurrency:
  group: fetch-sources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python scripts/fetch_sources.py
      - name: Commit sources
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sources
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update fetched sources"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
